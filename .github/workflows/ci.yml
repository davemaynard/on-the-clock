name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: uv sync
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: The committed assets must be what web/src builds
        run: git diff --exit-code -- on_the_clock/assets
      - run: npx playwright install --with-deps chromium
      - run: npm test
